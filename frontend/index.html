<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente Corporativo — MarketNova</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .badge {
      background: #e94560;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 12px; color: #aaa; margin-top: 2px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 14px;
    }

    .msg.user {
      background: #1a1a2e;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.agent {
      background: #fff;
      color: #222;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .msg.agent .text { white-space: pre-wrap; }

    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #666;
    }

    .sources span { font-weight: 600; color: #444; }

    .source-tag {
      display: inline-block;
      background: #f0f2f5;
      border-radius: 6px;
      padding: 2px 8px;
      margin: 3px 3px 0 0;
      font-size: 11px;
      color: #555;
    }

    .feedback {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .feedback button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }

    .feedback button:hover { background: #f5f5f5; }
    .feedback button.selected { background: #e8f5e9; border-color: #81c784; }

    .thinking {
      font-style: italic;
      color: #999;
      font-size: 13px;
      align-self: flex-start;
    }

    #input-area {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
    }

    #input-area input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }

    #input-area input:focus { border-color: #1a1a2e; }

    #input-area button {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #input-area button:disabled { background: #999; cursor: not-allowed; }
    #input-area button:hover:not(:disabled) { background: #16213e; }
  </style>
</head>
<body>

<header>
  <div>
    <div style="display:flex;align-items:center;gap:10px;">
      <h1>Agente Corporativo</h1>
      <span class="badge">IA</span>
    </div>
    <p>MarketNova · Responde con base en documentos internos oficiales</p>
  </div>
</header>

<div id="chat">
  <div class="msg agent">
    <div class="text">¡Hola! Soy el agente corporativo de MarketNova 👋

Puedo ayudarte a consultar políticas internas, procesos y documentación de la empresa. ¿En qué puedo ayudarte hoy?</div>
  </div>
</div>

<div id="input-area">
  <input id="query" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" />
  <button id="send-btn" onclick="sendMessage()">Enviar</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("query");
  const btn   = document.getElementById("send-btn");

  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  function addMessage(role, text, sources = [], answered = true) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;

    if (role === "agent") {
      const textEl = document.createElement("div");
      textEl.className = "text";
      textEl.textContent = text;
      div.appendChild(textEl);

      if (sources && sources.length > 0) {
        const src = document.createElement("div");
        src.className = "sources";
        src.innerHTML = "<span>Fuentes:</span><br/>";
        sources.forEach(s => {
          const tag = document.createElement("span");
          tag.className = "source-tag";
          tag.textContent = `${s.filename} (${s.category})`;
          src.appendChild(tag);
        });
        div.appendChild(src);
      }

      if (answered) {
        const fb = document.createElement("div");
        fb.className = "feedback";
        fb.innerHTML = `
          <button onclick="sendFeedback(this, '${encodeURIComponent(input.dataset.last || '')}', '${encodeURIComponent(text)}', 'positive')">👍</button>
          <button onclick="sendFeedback(this, '${encodeURIComponent(input.dataset.last || '')}', '${encodeURIComponent(text)}', 'negative')">👎</button>
        `;
        div.appendChild(fb);
      }
    } else {
      div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "thinking";
    div.textContent = "Buscando en los documentos...";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const query = input.value.trim();
    if (!query) return;

    input.dataset.last = query;
    addMessage("user", query);
    input.value = "";
    btn.disabled = true;

    const thinking = addThinking();

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      thinking.remove();
      addMessage("agent", data.response, data.sources, data.answered);
    } catch {
      thinking.remove();
      addMessage("agent", "Ocurrió un error al procesar tu pregunta. Por favor intenta de nuevo.");
    }

    btn.disabled = false;
    input.focus();
  }

  async function sendFeedback(btn, query, response, rating) {
    btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    await fetch("/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: decodeURIComponent(query),
        response: decodeURIComponent(response),
        rating,
      }),
    });
  }
</script>

</body>
</html>
